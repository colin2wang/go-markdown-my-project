# 全局默认排除规则：自动与项目配置的 exclude_* 合并（项目配置可增量追加，不可按条删除；
# 在项目配置中设置 use_default_excludes: false 可整体关闭）。
directories:
  - "**/.git"
  - "**/.idea"
  - "**/.vscode"
  - "**/.gradle"
  - "**/__pycache__"
  - "**/node_modules"
  - "**/dist"
  - "**/build"
  - "**/target"
  - "**/vendor"
  - "**/out"
  - "**/bin"
  - "**/obj"
  - "**/.next"
  - "**/coverage"
files:
  # 可执行 / 编译产物
  - "*.exe"
  - "*.dll"
  - "*.so"
  - "*.dylib"
  - "*.a"
  - "*.lib"
  - "*.o"
  - "*.obj"
  - "*.bin"
  - "*.pyc"
  - "*.class"
  - "*.jar"
  - "*.wasm"
  # 图片
  - "*.png"
  - "*.jpg"
  - "*.jpeg"
  - "*.gif"
  - "*.ico"
  - "*.svg"
  - "*.webp"
  # 归档
  - "*.zip"
  - "*.tar"
  - "*.gz"
  - "*.7z"
  - "*.rar"
  # 音视频
  - "*.mp3"
  - "*.mp4"
  - "*.avi"
  - "*.mov"
  # 二进制文档
  - "*.pdf"
  - "*.doc"
  - "*.docx"
  - "*.xls"
  - "*.xlsx"
  - "*.ppt"
  - "*.pptx"
  # 压缩后的前端产物
  - "*.min.js"
  - "*.min.css"
