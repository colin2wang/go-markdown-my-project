<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" shape-rendering="geometricPrecision">
  <defs>
    <!-- 小米经典橙色渐变 -->
    <linearGradient id="miOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A2E"/>
      <stop offset="0.55" stop-color="#FF6900"/>
      <stop offset="1" stop-color="#FF4D00"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect x="72" y="64" width="368" height="384" rx="80" fill="url(#miOrange)"/>

  <!-- 白线，严格采用原版视觉长度 -->
  <g fill="#FFFFFF">
    <!-- 第一条线：视觉宽度232，左边缘对齐140 -->
    <rect x="140" y="144" width="232" height="48" rx="24"/>
    <!-- 第二条线：视觉宽度232，左边缘对齐140 -->
    <rect x="140" y="232" width="232" height="48" rx="24"/>
    <!-- 第三条线：视觉宽度160，左边缘对齐140 -->
    <rect x="140" y="320" width="160" height="48" rx="24"/>
  </g>
</svg>